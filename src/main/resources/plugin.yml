name: DBDPlugin
version: 2.0
main: pl.dbd.DBDPlugin
api-version: 1.21
depend: [LuckPerms]
softdepend: [PlaceholderAPI]
author: DBDTeam
description: Dead by Daylight plugin for Minecraft

commands:
  gotowy:
    description: Oznacz się jako gotowy do gry (lub dołącz do kolejki)
    usage: /<command>
    aliases: [ready]

  niegotowy:
    description: Anuluj gotowość / opuść kolejkę
    usage: /<command>
    aliases: [unready, notready]

  gameban:
    description: Zbanuj gracza z samej gry DBD
    usage: /<command> <nick> <czas_w_minutach> [powód]
    permission: dbd.admin
    permission-message: "&c&lBŁĄD! &7Nie masz dostępu do tej komendy."

  gameunban:
    description: Odbanuj gracza z gry DBD
    usage: /<command> <nick>
    permission: dbd.admin
    permission-message: "&c&lBŁĄD! &7Nie masz dostępu do tej komendy."

  game:
    description: Zarządzanie grą
    usage: /<command> <start|stop|setlobby|setkilledspawn|setescapedspawn|info>
    permission: dbd.admin
    aliases: [gra]

  gamemap:
    description: Zarządzanie mapami
    usage: /<command> <create|remove|list> [nazwa]
    permission: dbd.admin
    aliases: [mapa, map]

  generator:
    description: Zarządzanie generatorami
    usage: /<command> <add|remove|list|reset>
    permission: dbd.admin
    aliases: [gen]

  exitgate:
    description: Zarządzanie bramami wyjściowymi
    usage: /<command> <add|remove|list|reset>
    permission: dbd.admin
    aliases: [brama, gate]

  locker:
    description: Zarządzanie szafami
    usage: /<command> <add|remove|list|reset>
    permission: dbd.admin
    aliases: [szafa]

  ogladaj:
    description: Obserwuj gracza
    usage: /<command> [nick]
    aliases: [spectate, spec, watch]

  heal:
    description: Wylecz gracza
    usage: /<command> [gracz|all]
    permission: dbd.admin

  healall:
    description: Wylecz wszystkich graczy
    usage: /<command>
    permission: dbd.admin
    aliases: [ha]

  hook:
    description: Twórz/usuwaj haki
    usage: /<command> <create|remove|reset|list>
    permission: dbd.admin
    aliases: [hak]

  window:
    description: Zarządzanie oknami
    usage: /<command> <create|list|reset|info>
    permission: dbd.admin

  dusze:
    description: Zarządzanie Duszami Nexusa
    usage: /<command> [dodaj|zabierz|ustaw|top|mnoznik] [gracz|rola] [ilość|wartość]
    aliases: [souls, dusza]

  sklepzadusze:
    description: Sklep – kup klucze za Dusze Nexusa
    usage: /<command>
    aliases: [sklep, shop, store]

  ekwipunek:
    description: Ekwipunek gracza (przedmioty, perki, klucze)
    usage: /<command> [survivor|killer]
    aliases: [eq, equipment, inv]

  shopadmin:
    description: Menu administracyjne do edycji cen w sklepie Nexusa.
    usage: /<command>
    aliases: [sklepadmin, eadmsklep]
    permission: dbd.admin
    permission-message: "&c&lBŁĄD! &7Nie masz dostępu do edycji sklepu."

  ekwipunekadmin:
    description: Menu administracyjne edycji ekwipunku graczy
    usage: /<command>
    permission: dbd.admin
    aliases: [eqadmin]

  dbd:
    description: Zarządzanie bazą DBD i reloadowanie configów
    usage: /<command> reload
    permission: dbd.admin

  trycrawl:
    description: Test pelzania po ziemi
    usage: /<command>
    permission: dbd.admin

  blockeq:
    description: Blokuje graczom możliwość otrzymywania perków i przedmiotów do meczu.
    usage: /<command>
    permission: dbd.admin
    aliases: [blockperks, blockitems]

  statsreset:
    description: Resetowanie statystyk gier gracza
    usage: /<command> [gracz]
    permission: dbd.admin
    aliases: [resetstatystyk, resetstats]

  top:
    description: Pokazuje najlepszych graczy w statystykach
    usage: /<command>
    permission: dbd.top
    aliases: [topka, topki]

permissions:
  dbd.admin:
    description: Uprawnienia administratora
    default: op
    children:
      - dbd.game.start
      - dbd.game.end
      - dbd.game.setspawn
      - dbd.map.manage
      - dbd.generator.manage

  dbd.killer:
    description: Uprawnienia killera (nadawane automatycznie w grze)
    default: false

  dbd.survivor:
    description: Uprawnienia survivora (nadawane automatycznie w grze)
    default: false

  dbd.oglada:
    description: Permisja dla obserwatorów (nadawana automatycznie)
    default: false

  dbd.game.start:
    description: Wymuszenie startu gry
    default: op

  dbd.game.end:
    description: Zakończenie gry
    default: op

  dbd.game.setspawn:
    description: Ustawianie spawnów
    default: op

  dbd.map.manage:
    description: Zarządzanie mapami
    default: op

  dbd.generator.manage:
    description: Zarządzanie generatorami
    default: op