# ═══════════════════════════════════════════════════════════════
#                    DBD PLUGIN - CONFIGURATION
# ═══════════════════════════════════════════════════════════════

# Wymagana liczba generatorów do otwarcia drzwi
generators-required: 5

# Dusze – komenda wywoływana gdy gracz dostaje nagrody
souls:
  add-command: "dusze dodaj {player} {amount} {reason}"

# ═══════════════════════════════════════════════════════════════
#                         HAKI
# ═══════════════════════════════════════════════════════════════

hook:
  carry-escape-required: 3
  stage-timer: 60
  skillcheck-interval: 10

# ═══════════════════════════════════════════════════════════════
#                    OBRAŻENIA OD UPADKU
# ═══════════════════════════════════════════════════════════════

fall:
  downed-distance: 15
  injured-distance: 12
  slowdown-distance: 8

# ═══════════════════════════════════════════════════════════════
#                         AFK SYSTEM
# ═══════════════════════════════════════════════════════════════
afk:
  warning-times:
    - 240
    - 300
    - 360
    - 600
  bat-time: 240
  kick-time: 660
  warning-message: "§e§lUWAGA AFK! §7Brak ruchu od {time}s. Za {left}s zostaniesz wykopany!"
  kick-message: "§c§lZostałeś wykopany za AFK podczas meczu!"
  ban-message: "§c§lBan za wielokrotny AFK podczas meczu."
  return-message: "§aWróciłeś do gry! Jesteś aktywny."
  afk-threshold: 2
  forget-afk-after-days: 7
  ban-delays-seconds:
    - 1800
    - 3600
    - 604800
    - 1209600
    - 2592000
    - 5184000
    
exit-gate-open-time: 20

# ═══════════════════════════════════════════════════════════════
#             KARY ZA WYJŚCIE Z GRY (QUIT PENALTY)
# ═══════════════════════════════════════════════════════════════
quit-penalty:
  warnings-for-10m: 5
  warnings-for-20m: 10
  warnings-for-2w: 20
  messages:
    warn-chat: "§c§lOpuściłeś trwający mecz! §7Otrzymujesz ostrzeżenie: §e{warnings}"
    warn-title: "§c§lOSTRZEŻENIE"
    warn-subtitle: "§7Wyszedłeś z serwera w trakcie meczu!"
    ban-reason-10m: "§cZbanowano na 10 minut za wychodzenie z meczu (5 ostrzeżeń)."
    ban-reason-20m: "§cZbanowano na 20 minut za wychodzenie z meczu (10 ostrzeżeń)."
    ban-reason-2w: "§cZbanowano na 2 tygodnie za wychodzenie z meczu (20 ostrzeżeń)."

# ═══════════════════════════════════════════════════════════════
#                         WIADOMOŚCI
# ═══════════════════════════════════════════════════════════════

messages:
  generator-start: "§aRozpoczynam naprawę generatora..."
  generator-tip: "§7Trzymaj PPM i wykonuj skill checki!"
  generator-completed: "§a§l✓ Generator ukończony!"
  generator-failed: "§c§l✗ Skill Check FAIL!"
  skill-check-success: "§a§l✓ Skill Check!"
  skill-check-great: "§e§l⚡ GREAT SKILL CHECK!"

  hook-level-1: "§c§lNA HAKU! §7Poziom I"
  hook-level-2: "§c§lNA HAKU! §7Poziom II"
  hook-rescued: "§aUratowałeś gracza: §e{player}"
  hook-rescued-by: "§aZostałeś uratowany przez: §e{player}"
  hook-died: "§4§lUMARŁEŚ NA HAKU!"

  game-killer: "§c§lKILLER!"
  game-survivor: "§a§lSURVIVOR!"
  game-survivor-tip: "§7Napraw 5 generatorów!"
  game-started: "§c§lGRA ROZPOCZĘTA!"
  game-ended: "§c§lGRA ZAKOŃCZONA!"
  game-not-enough-players: "§cNiewystarczająco graczy! Potrzeba minimum 2."

  lobby-busy: "§cNie można użyć /gotowy podczas trwającego meczu!"
  queue-joined: "§aDołączyłeś do kolejki na następny mecz! §7({count}/5)"
  queue-full: "§cKolejka jest pełna! §7Maksymalnie 5 graczy może czekać."

  no-permission: "§cNie masz uprawnień!"
