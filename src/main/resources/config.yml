# ═══════════════════════════════════════════════════════════════
#                    DBD PLUGIN - CONFIGURATION
# ═══════════════════════════════════════════════════════════════

# Wymagana liczba generatorów do otwarcia drzwi
generators-required: 5

# Dusze – komenda wywoływana gdy gracz dostaje nagrody
souls:
  add-command: "dusze dodaj {player} {amount} {reason}"
  
souls-rewards:
  # Nagrody za finał meczu
  match-killer-win: 5
  match-killer-loss: 0
  match-survivor-escape: 5
  match-survivor-walkover: 5

  # Działania w trakcie gry - Ocalały
  survivor-heal: 1
  survivor-unhook-rescuer: 1
  survivor-unhook-rescued: 1
  survivor-hide-locker: 1
  survivor-exit-gate-open: 2
  survivor-exit-gate-escape: 3

  # Działania w trakcie gry - Zabójca
  killer-hook-stage-1: 1
  killer-hook-stage-2: 2
  killer-hook-stage-3: 3
  killer-kill: 3
  killer-power-use: 1

# ═══════════════════════════════════════════════════════════════
#                    CZEK NA DUSZE NEXUSA
# ═══════════════════════════════════════════════════════════════
souls-cheque:
  name: "&e&lCzek na Dusze Nexusa"
  lore:
    - "&7Wartość: &e{amount}"
    - ""
    - "&8▸ &7Kliknij &fPPM&7, by zrealizować."
  message-created: "&8▸ &aStworzono czek na &e{amount} &7Dusz Nexusa."
  message-redeemed: "&8▸ &aZrealizowano czek! &7Otrzymujesz &e{amount} &7Dusz Nexusa."

# ═══════════════════════════════════════════════════════════════
#                         HAKI
# ═══════════════════════════════════════════════════════════════

hook:
  anti-camp-time: 30
  carry-escape-required: 3
  stage-timer: 60
  skillcheck-interval: 10

# ═══════════════════════════════════════════════════════════════
#                    OBRAŻENIA OD UPADKU
# ═══════════════════════════════════════════════════════════════

fall:
  downed-distance: 15
  injured-distance: 12
  slowdown-distance: 8

# ═══════════════════════════════════════════════════════════════
#                         AFK SYSTEM
# ═══════════════════════════════════════════════════════════════
afk:
  warning-times:
    - 240
    - 300
    - 360
    - 600
  bat-time: 240
  kick-time: 660
  warning-message: "§e§lUWAGA AFK! §7Brak ruchu od {time}s. Za {left}s zostaniesz wykopany!"
  kick-message: "§c§lZostałeś wykopany za AFK podczas meczu!"
  ban-message: "§c§lBan za wielokrotny AFK podczas meczu."
  return-message: "§aWróciłeś do gry! Jesteś aktywny."
  afk-threshold: 2
  forget-afk-after-days: 7
  ban-delays-seconds:
    - 1800
    - 3600
    - 604800
    - 1209600
    - 2592000
    - 5184000
    
exit-gate-open-time: 20

# ═══════════════════════════════════════════════════════════════
#             KARY ZA WYJŚCIE Z GRY (QUIT PENALTY)
# ═══════════════════════════════════════════════════════════════
quit-penalty:
  warnings-for-10m: 5
  warnings-for-20m: 10
  warnings-for-2w: 20
  messages:
    warn-chat: "§c§lOpuściłeś trwający mecz! §7Otrzymujesz ostrzeżenie: §e{warnings}"
    warn-title: "§c§lOSTRZEŻENIE"
    warn-subtitle: "§7Wyszedłeś z serwera w trakcie meczu!"
    ban-reason-10m: "§cZbanowano na 10 minut za wychodzenie z meczu (5 ostrzeżeń)."
    ban-reason-20m: "§cZbanowano na 20 minut za wychodzenie z meczu (10 ostrzeżeń)."
    ban-reason-2w: "§cZbanowano na 2 tygodnie za wychodzenie z meczu (20 ostrzeżeń)."

